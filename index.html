<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Liens</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  margin: 0;
  padding: 10px;
}

h2 {
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.card {
  background: #222;
  padding: 10px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: none;
  border-radius: 6px;
}

.download {
  background: #4CAF50;
  color: white;
}

.video {
  background: #2196F3;
  color: white;
}
</style>
</head>

<body>

<h2>📱 Mes Liens</h2>

<div class="grid">

  <div class="card">
    <p>📥 Fichier 1</p>
    <button class="download" onclick="window.open('https://example.com')">
      Télécharger
    </button>
  </div>

  <div class="card">
    <p>🎬 Vidéo</p>
    <button class="video" onclick="document.getElementById('v1').style.display='block'">
      Voir vidéo
    </button>

    <div id="v1" style="display:none; margin-top:10px;">
      <iframe width="100%" height="150"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      frameborder="0"></iframe>
    </div>
  </div>

</div>

</body>
</html>
